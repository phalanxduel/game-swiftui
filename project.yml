name: PhalanxDuelClient
options:
  bundleIdPrefix: com.phalanxduel
packages:
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing.git
    from: 1.17.5
targets:
  PhalanxDuelClient:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: PhalanxDuelClient
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        DEVELOPMENT_TEAM: "" # Set this in local overrides or UI if needed
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  PhalanxDuelClientTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: PhalanxDuelClientTests
    dependencies:
      - target: PhalanxDuelClient
      - package: SnapshotTesting
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  PhalanxDuelClientContractTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: PhalanxDuelClientTests/PhalanxDuelClientTests.swift
    dependencies:
      - target: PhalanxDuelClient
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  PhalanxDuelClientUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: PhalanxDuelClientUITests
    dependencies:
      - target: PhalanxDuelClient
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PhalanxDuelClient:
    build:
      targets:
        PhalanxDuelClient: all
    run:
      config: Debug
      storeKitConfiguration: PhalanxDuelClient/PhalanxStore.storekit
      environmentVariables:
        PHALANX_DEBUG_LOG_PATH: /Users/mike/github.com/phalanxduel/game-swiftui/.debug_session.log
        PHALANX_VERBOSE_LOGGING: "true"
    test:
      config: Debug
      environmentVariables:
        PHALANX_DEBUG_LOG_PATH: /Users/mike/github.com/phalanxduel/game-swiftui/.debug_session.log
        PHALANX_VERBOSE_LOGGING: "true"
      targets:
        - PhalanxDuelClientTests
        - PhalanxDuelClientUITests
  PhalanxDuelClientUIProof:
    build:
      targets:
        PhalanxDuelClient: all
        PhalanxDuelClientContractTests: [test]
        PhalanxDuelClientUITests: [test]
    test:
      config: Debug
      environmentVariables:
        PHALANX_QA_CONFIG_PATH: "$(PHALANX_QA_CONFIG_FILE)"
      targets:
        - PhalanxDuelClientContractTests
        - PhalanxDuelClientUITests
