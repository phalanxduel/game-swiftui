name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Archive, release, and bump tap
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build, sign, and zip the app
        run: bash bin/archive-app.sh

      - name: Resolve version and previous tag
        id: vars
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          PREV_TAG="$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)"
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "prev_tag=$PREV_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        run: |
          bash bin/generate-notes.sh \
            "${{ steps.vars.outputs.prev_tag }}" \
            "${{ steps.vars.outputs.tag }}" > /tmp/notes.md

      - name: Locate built zip
        id: artifact
        run: |
          ZIP_PATH="$(find dist -maxdepth 1 -name 'PhalanxDuelClient-*-macOS.zip' | head -n1)"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.vars.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "Phalanx Duel Client ${{ steps.vars.outputs.version }} (alpha)" \
            --notes-file /tmp/notes.md \
            "${{ steps.artifact.outputs.zip_path }}"

      - name: Compute zip checksum
        id: checksum
        run: |
          SHA="$(shasum -a 256 "${{ steps.artifact.outputs.zip_path }}" | awk '{print $1}')"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-tap
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: phalanxduel/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_PAT }}
          path: homebrew-tap

      - name: Bump Casks/phalanx-duel-client.rb
        run: |
          sed -i '' \
            -e "s|^  version \".*\"\$|  version \"${{ steps.vars.outputs.version }}\"|" \
            -e "s|^  sha256 \".*\"\$|  sha256 \"${{ steps.checksum.outputs.sha256 }}\"|" \
            homebrew-tap/Casks/phalanx-duel-client.rb

      - name: Commit and push tap update
        working-directory: homebrew-tap
        run: |
          if git diff --quiet; then
            echo "No cask changes to commit"
            exit 0
          fi
          git config user.name "phalanxduel-release-bot"
          git config user.email "noreply@phalanxduel.com"
          git add Casks/phalanx-duel-client.rb
          git commit -m "chore: bump phalanx-duel-client to ${{ steps.vars.outputs.version }}"
          git push origin main
